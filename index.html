<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logio | Mundial</title>
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://flagcdn.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="topbar" aria-label="Navegacion principal">
        <a class="brand" href="#inicio" data-route="home" aria-label="Ir al inicio">
          <img class="brand-logo" src="assets/logo-mundial.png" alt="" aria-hidden="true" />
          <span>FWC26</span>
        </a>

        <div class="nav-links">
          <a class="nav-link is-active" href="#inicio" data-route="home">Inicio</a>
        </div>

        <form class="header-search" role="search">
          <input id="search" type="search" placeholder="Buscar..." aria-label="Buscar partidos" />
          <button type="submit" aria-label="Buscar">Go</button>
        </form>
      </nav>
    </header>

    <main>
      <section id="home-view" class="view is-visible">
        <section id="home-hero" class="home-hero">
          <div class="home-hero-inner">
            <h1>Todo sobre el Mundial</h1>
            <p>Resultados, Partidos y Viajes</p>

            <article id="hero-match" class="scoreboard" aria-live="polite"></article>

    
          </div>
        </section>

        <section class="home-grid">
          <article class="home-panel upcoming-panel">
            <h2>Proximos Partidos</h2>
            <div id="home-matches" class="mini-match-list"></div>
            <button class="red-cta" type="button" data-route="calendar">Ver Todos los Partidos</button>
          </article>

        </section>
      </section>

      <section id="calendar-view" class="view">
        <section class="page-title">
          <h1>Calendario de Partidos</h1>
        </section>

        <section class="filters" aria-label="Filtros del calendario">
          <select id="group-filter" aria-label="Grupo">
            <option value="">Grupo</option>
          </select>
          <select id="sort-filter" aria-label="Fecha">
            <option value="date">Fecha</option>
            <option value="city">Ciudad</option>
            <option value="stadium">Estadio</option>
          </select>
          <select id="country-filter" aria-label="Seleccionar Pais">
            <option value="">Seleccionar Pais</option>
          </select>
        </section>

        <section class="status-row" aria-live="polite">
          <span id="status-title">Cargando partidos...</span>
          <button id="reload-btn" type="button">Actualizar</button>
        </section>

        <section class="table-wrap">
          <table class="match-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Partido</th>
                <th>Hora</th>
                <th>Estadio</th>
                <th>Ciudad</th>
              </tr>
            </thead>
            <tbody id="matches-list"></tbody>
          </table>
        </section>

        <nav id="pagination" class="pagination" aria-label="Paginacion">
          <button type="button" disabled>&lt; Anterior</button>
          <button class="is-current" type="button">1</button>
          <button type="button" disabled>Siguiente &gt;</button>
        </nav>
      </section>

      <section id="detail-view" class="view">
        <section class="detail-title">
          <h1>Detalle del Partido</h1>
        </section>

        <article id="details-content" class="match-detail"></article>

        <div class="back-row">
          <button class="green-cta" type="button" data-route="calendar">Volver al Calendario</button>
        </div>
      </section>
    </main>

    <template id="match-row-template">
      <tr>
        <td class="match-date"></td>
        <td class="match-title"></td>
        <td class="match-time"></td>
        <td class="match-venue"></td>
        <td><button class="row-action" type="button">Ver Vuelos y Hoteles</button></td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
